[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperquery-lsm"
version = "1.0.0"
description = "Embedded Log-Structured Merge-Tree (LSM) Storage Engine with MemTable, WAL, Bloom Filter SSTables & Leveled Compaction"
readme = "README.md"
authors = [{ name = "Huighlet Eyram Zowonu" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hyperquery = "hyperquery.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
